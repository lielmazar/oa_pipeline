[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-pipeline"
version = "0.1.0"
description = "OpenAlex sustainable-fuels research pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "itsdangerous>=2.2",
    "werkzeug>=3.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "openai>=1.40",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline"]

[tool.ruff]
line-length = 100

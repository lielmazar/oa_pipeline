[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-pipeline"
version = "0.2.0"
description = "OpenAlex journal-article keyword pipeline: mirror → journal filter → keyword match"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyarrow>=15",
    "duckdb>=1.1",
    "orjson>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = [            # for the not-yet-ported LLM classification / QA code in llm/
    "openai>=1.40",
    "numpy>=1.26",
    "scipy>=1.13",
]
dev = [
    "pytest>=8",
    "moto[s3]>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

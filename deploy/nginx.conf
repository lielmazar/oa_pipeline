server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running SSE connections
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 30s;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Pass Cloudflare's proto header through (Flexible SSL: CF→nginx is HTTP,
        # but Cloudflare sets X-Forwarded-Proto: https which we forward to Flask)
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # Required for Server-Sent Events (SSE)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAlex Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .terminal { font-family: 'Courier New', monospace; font-size: 0.8rem; }
    .tag-pill  { display:inline-flex; align-items:center; gap:4px; padding:2px 8px;

  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="app-root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

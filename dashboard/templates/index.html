<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenAlex Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .terminal { font-family: 'Courier New', monospace; font-size: 0.8rem; }
    .tag-pill  { display:inline-flex; align-items:center; gap:4px; padding:2px 8px;
                 background:#dbeafe; color:#1e40af; border-radius:999px; font-size:0.75rem; }
    .tag-pill button { color:#60a5fa; line-height:1; }
    .tag-pill button:hover { color:#1e40af; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<!-- ── Login overlay ──────────────────────────────────────────────────────── -->
<div id="login-overlay" class="fixed inset-0 bg-gray-900/80 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-1">OpenAlex Pipeline</h1>
    <p class="text-gray-500 text-sm mb-6">Sign in to continue</p>
    <form id="login-form" class="space-y-4">
      <input id="login-username" type="text" placeholder="Username" autocomplete="username"
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"
             class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div id="login-error" class="text-red-600 text-sm hidden"></div>
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Sign in
      </button>
    </form>
  </div>
</div>

<!-- ── Top nav ────────────────────────────────────────────────────────────── -->
<nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-40 shadow-sm">
  <button id="nav-home" class="flex items-center gap-2 font-bold text-lg text-blue-700 hover:text-blue-900 transition">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
    </svg>
    OpenAlex Pipeline
  </button>
  <div class="flex items-center gap-3">
    <button id="nav-jobs"
            class="text-sm text-gray-500 hover:text-blue-700 transition px-3 py-1 rounded border border-gray-200 hover:border-blue-300 flex items-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      Jobs
      <span id="nav-jobs-badge" class="hidden text-xs bg-yellow-400 text-yellow-900 font-bold rounded-full px-1.5"></span>
    </button>
    <span id="nav-username" class="text-sm text-gray-500"></span>
    <button id="nav-logout"
            class="text-sm text-gray-500 hover:text-red-600 transition px-3 py-1 rounded border border-gray-200 hover:border-red-300">
      Sign out
    </button>
  </div>
</nav>

<!-- ── Home view ──────────────────────────────────────────────────────────── -->
<div id="view-home" class="max-w-6xl mx-auto px-6 py-8 hidden">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold">Pipelines</h2>
    <button id="btn-new-pipeline"
            class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      New Pipeline
    </button>
  </div>
  <div id="pipelines-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center text-gray-400 py-16">Loading...</div>
  </div>
</div>

<!-- ── Jobs monitor view ──────────────────────────────────────────────────── -->
<div id="view-jobs" class="max-w-5xl mx-auto px-6 py-8 hidden">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold">Job Monitor</h2>
    <button id="btn-refresh-jobs"
            class="text-sm text-gray-500 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition flex items-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Refresh
    </button>
  </div>
  <div id="jobs-table-wrap">
    <div class="text-gray-400 text-center py-16">Loading...</div>
  </div>
  <div id="jobs-log-panel" class="hidden mt-4">
    <div class="bg-gray-900 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2 bg-gray-800">
        <span id="jobs-log-title" class="text-gray-300 text-sm font-mono"></span>
        <div class="flex items-center gap-3">
          <span id="jobs-log-status" class="text-xs px-2 py-0.5 rounded bg-gray-700 text-gray-300"></span>
          <button id="btn-close-log" class="text-gray-400 hover:text-white text-sm">✕</button>
        </div>
      </div>
      <div id="jobs-log-output" class="terminal text-green-400 p-4 h-96 overflow-y-auto whitespace-pre-wrap text-xs"></div>
    </div>
  </div>
</div>

<!-- ── Pipeline detail view ───────────────────────────────────────────────── -->
<div id="view-pipeline" class="hidden">
  <!-- Header bar -->
  <div class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm">
    <div class="max-w-5xl mx-auto">
      <div class="flex items-center gap-3 mb-3">
        <button id="btn-back" class="text-gray-400 hover:text-gray-700 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <h2 id="pipeline-title" class="text-xl font-bold"></h2>
        <span id="pipeline-owner-badge" class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded"></span>
        <div class="ml-auto flex gap-2">
          <button id="btn-fork-pipeline"
                  class="hidden text-sm text-purple-700 border border-purple-300 px-3 py-1 rounded-lg hover:bg-purple-50 transition">
            Fork
          </button>
          <button id="btn-delete-pipeline"
                  class="hidden text-sm text-red-600 border border-red-300 px-3 py-1 rounded-lg hover:bg-red-50 transition">
            Delete
          </button>
        </div>
      </div>
      <!-- Stage progress stepper -->
      <div id="stage-stepper" class="flex items-center overflow-x-auto pb-1 gap-0"></div>
    </div>
  </div>

  <!-- Stage content panel -->
  <div class="max-w-5xl mx-auto px-6 py-6">
    <div id="stage-content"></div>
    <!-- Stage navigation (owner only, at bottom of stage) -->
    <div class="mt-6 flex justify-between items-center">
      <button id="btn-go-back-stage"
              class="hidden text-sm text-gray-500 hover:text-gray-800 border border-gray-300 px-4 py-2 rounded-lg hover:bg-gray-50 transition">
      </button>
      <div id="advance-bar" class="hidden ml-auto">
        <button id="btn-advance-stage"
                class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700 transition">
          Advance to <span id="advance-stage-label"></span> →
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── New pipeline modal ─────────────────────────────────────────────────── -->
<div id="modal-new-pipeline" class="fixed inset-0 bg-gray-900/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-4">Create New Pipeline</h3>
    <form id="form-new-pipeline" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
        <input id="new-pipeline-name" type="text" placeholder="e.g. SAF Research 2024"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <input id="new-pipeline-desc" type="text" placeholder="Optional"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="new-pipeline-error" class="text-red-600 text-sm hidden"></div>
      <div class="flex gap-3 justify-end">
        <button type="button" id="btn-cancel-new-pipeline"
                class="px-4 py-2 text-gray-600 border rounded-lg hover:bg-gray-50 transition">Cancel</button>
        <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">Create</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Fork pipeline modal ────────────────────────────────────────────────── -->
<div id="modal-fork-pipeline" class="fixed inset-0 bg-gray-900/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
    <h3 class="text-lg font-bold mb-2">Fork Pipeline</h3>
    <p class="text-sm text-gray-500 mb-4">Creates a full copy of this pipeline's data in your account. Large databases may take a moment.</p>
    <form id="form-fork-pipeline" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New Name *</label>
        <input id="fork-pipeline-name" type="text" placeholder="My Fork of ..."
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <div id="fork-pipeline-error" class="text-red-600 text-sm hidden"></div>
      <div class="flex gap-3 justify-end">
        <button type="button" id="btn-cancel-fork-pipeline"
                class="px-4 py-2 text-gray-600 border rounded-lg hover:bg-gray-50 transition">Cancel</button>
        <button type="submit"
                class="px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition">Fork</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Record detail modal ────────────────────────────────────────────────── -->
<div id="modal-record" class="fixed inset-0 bg-gray-900/60 flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-3xl max-h-[80vh] flex flex-col">
    <div class="flex justify-between items-start mb-4">
      <h3 class="text-base font-bold pr-4 flex-1" id="modal-record-title"></h3>
      <button id="btn-close-record" class="text-gray-400 hover:text-gray-700 flex-shrink-0">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div id="modal-record-body" class="overflow-y-auto flex-1 text-sm space-y-2"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>

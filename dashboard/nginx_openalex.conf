# /etc/nginx/sites-available/openalex-dashboard
#
# Reverse proxy for the OpenAlex Flask dashboard.
# SSE requires proxy_buffering off and a long read timeout.
#
# Deploy:
#   cp nginx_openalex.conf /etc/nginx/sites-available/openalex-dashboard
#   ln -sf /etc/nginx/sites-available/openalex-dashboard /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;   # Catch-all — replace with your IP or hostname if needed

    # Long timeouts required for SSE connections (jobs run for hours)
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Essential for SSE: disable connection keep-alive upgrade & buffering
        proxy_set_header   Connection         "";
        proxy_buffering    off;
        proxy_cache        off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
